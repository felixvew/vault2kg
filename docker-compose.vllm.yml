# vLLM for vault2kg: one container for the chat model, one for embeddings.
# vLLM serves one model per container, so they get two ports:
#   chat        http://localhost:8000/v1   (entity extraction, duplicate checks)
#   embeddings  http://localhost:8001/v1   (merging duplicates; LightRAG)
# vault2kg.py and kg_to_lightrag.py find both automatically.
#
#   docker compose -f docker-compose.vllm.yml up -d
#   python vault2kg.py ~/Documents/MyVault
#
# Needs an NVIDIA GPU with the NVIDIA Container Toolkit. Both containers share
# the GPU: together their --gpu-memory-utilization must stay below 1.0.
# A 24 GB card fits the defaults; on 16 GB use Qwen/Qwen2.5-7B-Instruct-AWQ.
# Gated models need HF_TOKEN in your environment.
services:
  vllm-chat:
    image: vllm/vllm-openai:latest
    ports: ["8000:8000"]
    ipc: host
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    command:
      - --model=Qwen/Qwen2.5-7B-Instruct
      - --max-model-len=16384
      - --gpu-memory-utilization=0.70
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  vllm-embed:
    image: vllm/vllm-openai:latest
    ports: ["8001:8000"]
    ipc: host
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    command:
      - --model=BAAI/bge-m3
      - --runner=pooling            # vLLM before 0.10: replace with --task=embed
      - --max-model-len=8192
      - --gpu-memory-utilization=0.20
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
